services:
  - type: web
    name: price-tracker-backend
    env: node
    plan: free
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MOCK_STORE_URL
        value: https://demo.inelabteamdev.com
      - key: HEADLESS
        value: "true"
      - key: MAX_SCRAPE_ATTEMPTS
        value: "6"
      - key: SCRAPE_CONCURRENCY
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
